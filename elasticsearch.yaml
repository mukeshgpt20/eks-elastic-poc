apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: elastic

spec:

  version: 9.5.0

  nodeSets:

    - name: default
      count: 3

      config:
        node.roles:
          - master
          - data
          - ingest

      volumeClaimTemplates:

        - metadata:
            name: elasticsearch-data

          spec:
            accessModes:
              - ReadWriteOnce

            storageClassName: gp3

            resources:
              requests:
                storage: 100Gi
